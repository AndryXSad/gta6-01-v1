<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — Open World Driving &amp; Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87bfe8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #hud-topleft { position: absolute; top: 14px; left: 16px; }
  #hud-health-label { font-weight: 800; letter-spacing: 2px; font-size: 14px; }
  #hud-health-bar { width: 210px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; margin-top: 3px; }
  #hud-health-fill { height: 100%; width: 100%; background: #37b24d; }
  #hud-cash { font-size: 22px; font-weight: 800; color: #7ee787; margin-top: 6px; }
  #hud-stars { position: absolute; top: 12px; right: 18px; font-size: 30px; letter-spacing: 3px; }
  #hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 46%; text-align: center; font-size: 16px; font-weight: 700; background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 8px; }
  #hud-dialog { position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%); max-width: 60%; text-align: center; font-size: 15px; font-style: italic; background: rgba(0,0,0,.5); padding: 7px 12px; border-radius: 8px; }
  #hud-toast { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; color: #ffd43b; background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 8px; transition: opacity .4s; }
  #hud-speed { position: absolute; bottom: 18px; right: 20px; font-size: 26px; font-weight: 800; }
  #hud-clock { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; background: rgba(0,0,0,.5); padding: 5px 12px; border-radius: 8px; }
  #hud-map-wrap { position: absolute; bottom: 14px; left: 16px; }
  #hud-map { border: 2px solid rgba(255,255,255,.75); border-radius: 8px; background: #20262e; display: block; }
  #hud-map-label { text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 3px; margin-top: 3px; }
  .menu, #hud-busted, #hud-done, #hud-paused { pointer-events: auto; }
  .menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(rgba(10,25,45,.45), rgba(10,25,45,.78)); text-align: center; padding: 20px; }
  .menu h1 { font-size: 84px; margin: 0; letter-spacing: 10px; color: #ffd43b; }
  #menu-sub { font-size: 20px; margin: 6px 0 2px; font-weight: 700; }
  #menu-story { max-width: 560px; font-size: 15px; line-height: 1.5; }
  .menu button, #hud-busted button, #hud-done button { pointer-events: auto; font-size: 18px; font-weight: 800; padding: 12px 28px; margin: 8px; border-radius: 10px; border: none; cursor: pointer; background: #ffd43b; color: #20262e; }
  .menu button:hover { background: #ffe066; }
  #menu-controls { font-size: 13px; opacity: .9; margin-top: 14px; }
  #hud-paused { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; background: rgba(0,0,0,.45); }
  #hud-busted, #hud-done { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(20,0,0,.55); text-align: center; }
  #hud-done { background: rgba(0,30,10,.55); }
  #hud-busted h2, #hud-done h2 { font-size: 52px; margin: 0; color: #ff8787; }
  #hud-done h2 { color: #7ee787; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar: open-world driving and heist game. Walk, drive, steal cars, outrun the police and finish four story missions."></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
